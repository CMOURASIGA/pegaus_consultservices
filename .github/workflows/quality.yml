name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run security:audit
      - run: npm run security:secrets
      - name: Smoke test standalone server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key-not-a-secret
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node apps/web/.next/standalone/apps/web/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..15}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent http://127.0.0.1:3000/login | grep --quiet 'Entrar'
          PRIVATE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/app)
          test "$PRIVATE_STATUS" = "307"
          PRIVATE_LOCATION=$(curl --silent --head http://127.0.0.1:3000/app | tr -d '\r' | awk 'tolower($1) == "location:" {print $2}')
          echo "$PRIVATE_LOCATION" | grep --quiet '/login?next=%2Fapp'
          MEMORY_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/memory)
          test "$MEMORY_STATUS" = "307"
          KNOWLEDGE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/knowledge)
          test "$KNOWLEDGE_STATUS" = "307"
          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > /tmp/manifest.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/manifest.json'));if(m.start_url!=='/app'||m.display!=='standalone')process.exit(1)"
          HEALTH_STATUS=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' http://127.0.0.1:3000/api/health)
          test "$HEALTH_STATUS" = "200" -o "$HEALTH_STATUS" = "503"
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json'));if(!['healthy','degraded','unavailable'].includes(h.status))process.exit(1)"
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore agents/windows/Pegasus.Agent.sln
      - run: dotnet build agents/windows/Pegasus.Agent.sln --configuration Release --no-restore
      - run: dotnet test agents/windows/Pegasus.Agent.Tests/Pegasus.Agent.Tests.csproj --configuration Release --no-build
      - name: Publish portable User Mode artifact
        run: dotnet publish agents/windows/Pegasus.Agent.UserMode/Pegasus.Agent.UserMode.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/pegasus-agent-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-agent-windows-x64
          path: artifacts/pegasus-agent-windows-x64
          if-no-files-found: error
